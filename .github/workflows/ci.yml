name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The firmware parity tests are skipped here: they need a smalltv-mod checkout (SMALLTV_MOD).
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: smalltv-studio
          path: dist/index.html
