version: 2
updates:
  # The workflow actions in ci.yml and pages.yml. pages.yml deploys with a
  # Pages write token, so these matter most.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release has to be two weeks old before it is proposed, so a hijacked
    # version has time to be found and yanked first. Same below.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # The app's npm dependencies (package.json, package-lock.json).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 5
